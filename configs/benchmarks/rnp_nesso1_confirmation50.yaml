id: rnp_nesso1_confirmation50_sep2021
status: frozen_before_inference
manifest: data/manifests/rnp_nesso1_confirmation50.json

question: Does an additional non-overlapping Runs N' Poses cohort reproduce the dependence of Nesso-1 structural metrics on pre-September-2021 structural familiarity?

source:
  name: Runs N' Poses
  doi: 10.5281/zenodo.14794785
  resolved_zenodo_record_id: 18366081
  structural_training_cutoff: 2021-09-30
  familiarity_metric: sucos_shape_pocket_qcov

selection:
  total_systems: 50
  excluded_sample_manifest: data/manifests/rnp_nesso1_pilot100.json
  exclusion_rule: exact_sample_id
  selected_before_inference: true
  bins_and_counts:
    0-20: 6
    20-30: 6
    30-40: 6
    40-50: 7
    50-60: 7
    60-70: 6
    70-80: 6
    80-100: 6
  within_cohort_diversity_constraints:
    - unique_runs_n_poses_cluster
    - unique_pdb_entry
    - unique_canonical_ligand_smiles
  seed: 2026082050

model_input:
  include:
    - exact_deposited_protein_sequence
    - ligand_smiles
  exclude:
    - experimental_coordinates
    - experimental_binding_pocket
    - structural_template
    - msa

model_and_metrics:
  model_config: configs/models/nesso1.yaml
  inference_seed: 42
  protocol: identical_to_exp012
  primary_metric: protein_ligand_distogram_negative_log_likelihood
  secondary_metrics:
    - expected_interface_distance_mae_angstrom
    - protein_ligand_contact_average_precision_at_6_angstrom
    - protein_ligand_contact_auroc_at_6_angstrom
    - pocket_residue_precision_recall_f1_at_6_angstrom
    - entropy_crop_pl_vs_structural_error

analysis:
  report_separately:
    - original_100_discovery_cohort
    - new_50_confirmation_cohort
    - combined_150_systems
  threshold_diagnostic:
    comparison: 40-50 versus 50-60 familiarity bins
    interpretation: exploratory_not_a_preregistered_universal_threshold
