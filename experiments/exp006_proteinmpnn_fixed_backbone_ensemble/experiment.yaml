id: exp006_proteinmpnn_fixed_backbone_ensemble
title: ProteinMPNN sequence ensemble on one fixed RFdiffusion backbone
status: completed_identity_and_entropy_analysis
question: Given one fixed RFdiffusion target-binder backbone, how diverse are the sequences ProteinMPNN considers compatible with it, and which positions are constrained by the receptor interface?
hypothesis: ProteinMPNN will generate a non-identical sequence ensemble with position-dependent conservation while preserving the fixed 90-residue binder backbone.

model: configs/models/proteinmpnn.yaml

input:
  pdb_path: runs/exp003_rfdiffusion_insr_binder_smoke/rfdiffusion/seed42/raw/design_ppi_42.pdb
  sha256: 2e68ae2e859b660ea2cf158be121dad6622e34ae87991eed3b286cd64b567b44
  provenance_experiment: exp003_rfdiffusion_insr_binder_smoke
  receptor_chain: A
  receptor_residues: 150
  designed_binder_chain: B
  binder_residues: 90
  backbone_selected_by_downstream_score: false

proteinmpnn:
  source_revision: 8907e6671bfbfc92303b5f79c4b5e6ce47cdef57
  model_name: v_48_020
  checkpoint_sha256: c9cb4a671d79604111231f8dbfc7c590e06f1197453b7a6854ac6661a642f5bd
  fixed_chains: [A]
  designed_chains: [B]
  sampling_temperature: 0.1
  backbone_noise_angstrom: 0.0
  batch_seeds: [6000, 6001, 6002, 6003, 6004, 6005, 6006, 6007, 6008, 6009]
  sequences_per_batch: 10
  total_sequences: 100
  batch_size: 1
  save_probabilities: true
  save_scores: true

execution:
  device: cpu
  reason: Avoid contention with an unrelated active GROMACS GPU simulation.
  python_executable: /home/yusheng/anaconda3/bin/python
  pytorch_version: 2.5.1
  environment_note: Compatibility-tested existing NVMe environment; stochastic samples are not assumed bitwise identical to the earlier PyTorch 1.9.1 smoke test.
  cuda_visible_devices: ""
  omp_num_threads: 1
  blas_num_threads: 1
  low_process_priority: true
  low_io_priority: true

protocol_deviations_before_results:
  - initial_attempt:
      python_executable: external/envs/rfdiffusion/bin/python
      pytorch_version: 1.9.1
      status: interrupted_before_model_load_or_sequence_generation
      elapsed_seconds: 326.627
      reason: Severe HDD paging while loading 3.5 GB of CUDA-linked PyTorch libraries.
  - approved_restart:
      python_executable: /home/yusheng/anaconda3/bin/python
      pytorch_version: 2.5.1
      compatibility_test_exit_status: 0
      compatibility_test_wall_seconds: 3.71

outputs:
  run_root: runs/exp006_proteinmpnn_fixed_backbone_ensemble/proteinmpnn/fixed_backbone_cpu
  raw_batches: batch_seed<seed>/raw
  aggregate_predictions: sequences.csv
  run_metadata: run.json
  environment_snapshot: environment.txt
  gpu_snapshot: nvidia_smi_before.txt

success_criteria:
  - all_ten_batch_exit_statuses_zero
  - exactly_ten_sampled_sequences_per_batch
  - exactly_one_hundred_aggregate_samples
  - every_binder_sequence_length_is_90
  - native_probability_archives_retained
  - native_score_archives_retained
  - provenance_and_resource_use_recorded

not_success_criteria:
  - all_sequences_unique
  - favorable_binding_affinity
  - experimental_binding
  - foldability
  - specificity

stopping_rule: Stop after generation and engineering audit; review the ensemble-analysis and candidate-selection policy before downstream all-atom prediction.

