id: exp003_rfdiffusion_insr_binder_smoke
title: RFdiffusion insulin-receptor one-backbone smoke test
status: completed_engineering_smoke_test
question: Can the pinned local RFdiffusion and ProteinMPNN setup generate one auditable insulin-receptor-directed binder backbone, preserve its denoising trajectory, and assign reproducible candidate sequences?
hypothesis: The run will complete on the local RTX 3080 and produce a parseable final complex, both native trajectory types, run metadata, and four ProteinMPNN sequences for the generated chain.

models:
  - configs/models/rfdiffusion.yaml
  - configs/models/proteinmpnn.yaml

target:
  source_path: external/src/RFdiffusion/examples/input_pdbs/insulin_target.pdb
  sha256: b5ab52ee165f33b3d467407ecc3607cb5b70fb6c2972cf2d6ed7ff3294153480
  retained_residues: A1-150
  reference_available_during_generation: true

rfdiffusion:
  contig: "[A1-150/0 70-100]"
  hotspots: [A59, A83, A91]
  checkpoint: Complex_base_ckpt.pt
  deterministic: true
  design_startnum_and_seed: 42
  num_designs: 1
  diffusion_steps: 50
  final_step: 1
  noise_scale_ca: 0
  noise_scale_frame: 0
  write_trajectory: true

proteinmpnn:
  target_chain_fixed: true
  generated_binder_chain_designed: true
  model_name: v_48_020
  seed: 42
  num_sequences: 4
  sampling_temperature: 0.1
  backbone_noise_angstrom: 0.0
  save_probabilities: true
  animation_sequence_rule: lowest_designed_chain_mean_negative_log_probability

outputs:
  - final_poly_glycine_complex_pdb
  - reverse_state_Xt_minus_1_trajectory_pdb
  - per_step_clean_prediction_pX0_trajectory_pdb
  - rfdiffusion_trb_metadata
  - proteinmpnn_fasta
  - proteinmpnn_probabilities
  - resolved_run_provenance

success_criteria:
  - process_exit_status_zero
  - gpu_used
  - final_complex_parseable
  - target_chain_has_150_residues
  - generated_chain_length_between_70_and_100
  - both_trajectories_have_50_models
  - proteinmpnn_returns_four_sequences_for_binder_chain_only

forbidden_claims:
  - experimental_binding
  - binding_affinity
  - specificity
  - functional_activity
  - benchmark_accuracy

stopping_rule: Stop after one RFdiffusion backbone and four ProteinMPNN sequences are generated and audited; require review before additional backbones or experimental interpretation.

