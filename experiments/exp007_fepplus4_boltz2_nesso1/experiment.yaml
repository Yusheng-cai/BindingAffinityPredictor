id: exp007_fepplus4_boltz2_nesso1
title: Released-model reproduction of Boltz-2 and Nesso-1 on the FEP+ four-kinase benchmark
status: complete
question: Can the released Boltz-2 and Nesso-1 models reproduce their reported within-target affinity ranking on the same 87 neutral compounds?
hypothesis: Nesso-1 will have higher compound-weighted target Pearson correlation and lower amortized runtime than Boltz-2, but confidence intervals and per-target results will reveal substantial heterogeneity.

manifest: data/manifests/fepplus4_87.json
benchmark_config: configs/benchmarks/fepplus4_87.yaml
model_configs:
  - configs/models/boltz2.yaml
  - configs/models/nesso1.yaml

stages:
  - name: tyk2_pilot
    targets: [tyk2]
    compounds: 16
    purpose: validate_identical_inputs_output_parsing_and_metric_direction_before_full_expansion
  - name: full_reproduction
    targets: [cdk2, tyk2, jnk1, p38]
    compounds: 87
    starts_only_after: tyk2_pilot_engineering_validation

boltz2:
  seed: 42
  structure_recycling_steps: 3
  structure_diffusion_samples: 1
  structure_sampling_steps: 200
  affinity_recycling_steps_resolved_internally: 5
  affinity_diffusion_samples: 5
  affinity_sampling_steps: 200
  no_kernels: true
  affinity_mw_correction: false
  msa: one_ColabFold_MMseqs2_result_per_unique_protein_chain_reused_across_ligands
  msa_pairing_strategy: greedy

nesso1:
  seed: 42
  recycling_steps: 5
  precision: bf16-mixed
  refine_protein_inference: true
  no_kernels: true
  esm_embeddings: one_per_unique_protein_chain_reused_across_ligands

analysis:
  blind_labels_during_inference: true
  raw_native_outputs_preserved: true
  continuous_affinity_field: affinity_pred_value
  binder_probability_analyzed_separately: true
  bootstrap_iterations: 2000
  bootstrap_seed: 20260817

stability_followup:
  status: predefined_but_not_part_of_primary_87_run
  selection_rule: weakest_median_and_strongest_experimental_ligand_per_target
  additional_seeds: [7, 314]
  purpose: estimate_seed_sensitivity_without_multiplying_the_entire_primary_compute_budget

stopping_rule: Complete the TYK2 pilot; if all 16 inputs yield finite native scores, expand without changing settings to the other 71 compounds. Record and report all failures without silently removing compounds.

