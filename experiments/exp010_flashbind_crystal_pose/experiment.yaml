  median_fixed_receptor_pocket_ca_rmsd_angstrom: 0.20770435552190586
  mean_fixed_receptor_pocket_ca_rmsd_angstrom: 0.22018643672901722
  median_pocket_aligned_ligand_rmsd_angstrom: 0.634337861775331
  mean_pocket_aligned_ligand_rmsd_angstrom: 0.6507138584155987
  pose_success_below_2_angstrom: 16
  pose_success_fraction: 1.0
  flashbind_lower_rmsd_than_boltz2_pairs: 9
  boltz2_lower_rmsd_than_flashbind_pairs: 7
  raw_metrics: runs/exp010_flashbind_crystal_pose/released_poses/pose_metrics.json
  reviewed_summary: reports/exp010_flashbind_crystal_pose/README.md
